# Single-material strip whose top surface transforms into a brittle, swelling phase
# (oxide-like). The front depth follows a cubic law s^3 = k t; the new phase expands by the
# Pilling-Bedworth ratio, split between the surface normal and the in-plane directions.
# The swelling (not a thermal mismatch) drives the stresses.
#   ./build/stripcz inputs/transforming_strip.ini

[model]
type = transformation

[geometry]
length = 4e-3
width = 0.1e-3
n_layers = 1

[mesh]
nx = 80
ny = 1

[layer0]                      # parent (substrate) material, Zr-like
thickness = 0.5e-3
nz = 24
grading = 1.6                 # finer elements near the transforming surface
youngs_modulus = 95e9
poisson_ratio = 0.34
x_cracks = all
z_cracks = all                # spallation / delamination at any depth (incl. the front)

[transformation]
exponent = 3                  # cubic growth law s^3 = k t
depth_at_time = 100e-6, 1e4   # s = 100 um after 1e4 s  (sets k)
pilling_bedworth_ratio = 1.56 # ZrO2/Zr
anisotropy = 0.005            # e_inplane / e_normal (oxide growth is mostly normal to the surface)
[phase]                       # transformed phase, ZrO2-like
youngs_modulus = 200e9
poisson_ratio = 0.30

[fracture.substrate]
strength.mean = 400e6
strength.weibull_modulus = 15
toughness.mean = 100
toughness.weibull_modulus = 15
correlation_length = 30e-6
seed = 1
[fracture.phase]
strength.mean = 150e6
strength.weibull_modulus = 6
toughness.mean = 5
toughness.weibull_modulus = 6
correlation_length = 30e-6
seed = 2
[fracture.front]
strength.mean = 150e6
strength.weibull_modulus = 8
toughness.mean = 20
toughness.weibull_modulus = 8
correlation_length = 30e-6
seed = 3

[cohesive]
stiffness = 1e17
viscosity = 1e-4
mode_mixity_beta = 1.0

[boundary]
mode = free
plane_strain_y = true

[time]
end = 1e4
dt_initial = 1e-3
dt_max = 200

[output]
directory = runs/transforming_strip
times = 100, 1000, 3000, 10000
on_crack_area_growth = 0.02e-6
