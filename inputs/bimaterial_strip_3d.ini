# OPTIONAL 3D version of the bi-material strip: a square plate patch, so channel cracks in x AND y
# can form a mud-crack network in the brittle top layer, and delamination can spread in 2D.
# Expensive (see the README cost table); planned by the study tools with --dim 3d, not run there.
#   ./build/stripcz --dry-run inputs/bimaterial_strip_3d.ini      # sizes and memory only
#   OMP_NUM_THREADS=32 ./build/stripcz inputs/bimaterial_strip_3d.ini

[model]
type = bimaterial

[geometry]
length = 2e-3                 # x
width = 2e-3                  # y
n_layers = 2
total_thickness = 0.5e-3
top_fraction = 0.2

[mesh]
nx = 40                       # 50 um in-plane, as in the 2D demos
ny = 40
nz_total = 20

[layer0]                      # substrate: no crack planes (the 2D demos never cracked it) - saves dofs
youngs_modulus = 200e9
poisson_ratio = 0.30
thermal_expansion = 17e-6
x_cracks = none
y_cracks = none
[layer1]                      # brittle top layer: cracks on every element boundary in x and y
youngs_modulus = 380e9
poisson_ratio = 0.22
thermal_expansion = 8e-6
x_cracks = all
y_cracks = all

[material]
reference_temperature = 293.15

[fracture.top]
strength.mean = 150e6
strength.weibull_modulus = 6
toughness.mean = 10
toughness.weibull_modulus = 6
correlation_length = 50e-6
toughness_strength_correlation = 0.5
seed = 2
[fracture.bottom]
strength.mean = 400e6
strength.weibull_modulus = 15
toughness.mean = 100
toughness.weibull_modulus = 15
correlation_length = 50e-6
seed = 1
[fracture.interface]
strength.mean = 200e6
strength.weibull_modulus = 8
toughness.mean = 20
toughness.weibull_modulus = 8
correlation_length = 50e-6
seed = 3

[cohesive]
stiffness = 1e17
viscosity = 1e-4
mode_mixity_beta = 1.0

[loading]
temperature_history = 0, 293.15; 500, 793.15

[boundary]
mode = free                   # free plate patch (3-2-1 pins); edges are free surfaces
y_faces = free

[time]
end = 500
dt_initial = 1
dt_max = 5

[output]
directory = runs/bimaterial_strip_3d
times = 100, 200, 300, 400, 500
on_crack_area_growth = 0.1e-6
