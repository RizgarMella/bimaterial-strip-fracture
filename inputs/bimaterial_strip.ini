# Bi-material strip under differential thermal expansion.
# A brittle top layer (alumina-like, low toughness) bonded to a tougher substrate (steel-like).
# Heating: the substrate expands more (17e-6 vs 8e-6 1/K), so the top layer goes into tension and
# channel-cracks; cracks may kink into the interface (delamination) or penetrate the substrate.
#   ./build/stripcz inputs/bimaterial_strip.ini

[model]
type = bimaterial

[geometry]
length = 4e-3
width = 0.1e-3
n_layers = 2
total_thickness = 0.5e-3
top_fraction = 0.2           # thickness-ratio series: vary this at fixed total thickness

[mesh]
nx = 80
ny = 1
nz_total = 20

[layer0]                     # substrate (bottom)
youngs_modulus = 200e9
poisson_ratio = 0.30
thermal_expansion = 17e-6
x_cracks = all               # channel cracks may penetrate the substrate
[layer1]                     # brittle top layer
youngs_modulus = 380e9
poisson_ratio = 0.22
thermal_expansion = 8e-6
x_cracks = all

[material]
reference_temperature = 293.15

# Weibull strength [Pa] and fracture energy [J/m2], separately for each zone
[fracture.top]
strength.mean = 150e6
strength.weibull_modulus = 6
toughness.mean = 10
toughness.weibull_modulus = 6
correlation_length = 50e-6
toughness_strength_correlation = 0.5
seed = 2
[fracture.bottom]
strength.mean = 400e6
strength.weibull_modulus = 15
toughness.mean = 100
toughness.weibull_modulus = 15
correlation_length = 50e-6
seed = 1
[fracture.interface]
strength.mean = 200e6
strength.weibull_modulus = 8
toughness.mean = 20
toughness.weibull_modulus = 8
correlation_length = 50e-6
seed = 3

[cohesive]
stiffness = 1e17
viscosity = 1e-4
mode_mixity_beta = 1.0        # shear contributes to interface / kinked cracks

[loading]
temperature_history = 0, 293.15; 500, 793.15

[boundary]
mode = free                   # free (3-2-1 pins) | roller_bottom | clamped_bottom | clamped_end
y_faces = generalized         # wide free plate: uniform in-plane strain and curvature across the width

[time]
end = 500
dt_initial = 1
dt_max = 5

[output]
directory = runs/bimaterial_strip
times = 100, 200, 300, 400, 500
on_crack_area_growth = 0.02e-6
