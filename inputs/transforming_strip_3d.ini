# OPTIONAL 3D version of the transforming strip: a square plate patch whose top transforms
# (cubic growth, Pilling-Bedworth swelling). Channel cracks in x and y (mud cracks for PBR < 1),
# and spallation in 2D patches (PBR > 1). Expensive; planned with --dim 3d, not run there.
#   ./build/stripcz --dry-run inputs/transforming_strip_3d.ini

[model]
type = transformation

[geometry]
length = 2e-3
width = 2e-3
n_layers = 1

[mesh]
nx = 40
ny = 40

[layer0]
thickness = 0.5e-3
nz = 24
grading = 1.6
youngs_modulus = 95e9
poisson_ratio = 0.34
x_cracks = all
y_cracks = all
z_cracks = all                # needed for spallation at the moving front

[transformation]
exponent = 3
depth_at_time = 100e-6, 1e4
pilling_bedworth_ratio = 1.56
anisotropy = 0.005
[phase]
youngs_modulus = 200e9
poisson_ratio = 0.30

[fracture.substrate]
strength.mean = 400e6
strength.weibull_modulus = 15
toughness.mean = 100
toughness.weibull_modulus = 15
correlation_length = 30e-6
seed = 1
[fracture.phase]
strength.mean = 150e6
strength.weibull_modulus = 6
toughness.mean = 5
toughness.weibull_modulus = 6
correlation_length = 30e-6
seed = 2
[fracture.front]
strength.mean = 150e6
strength.weibull_modulus = 8
toughness.mean = 20
toughness.weibull_modulus = 8
correlation_length = 30e-6
seed = 3

[cohesive]
stiffness = 1e17
viscosity = 1e-4
mode_mixity_beta = 1.0

[boundary]
mode = free
y_faces = free

[time]
end = 1e4
dt_initial = 1e-3
dt_max = 200

[output]
directory = runs/transforming_strip_3d
times = 100, 1000, 3000, 10000
on_crack_area_growth = 0.1e-6
