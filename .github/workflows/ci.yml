name: build-and-test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP and MPI
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libopenmpi-dev openmpi-bin
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Unit and verification tests
        run: cd build && ctest --output-on-failure
      - name: MPI ensemble smoke test
        run: |
          printf "inputs/bimaterial_strip.ini mesh.nx=10 mesh.nz_total=6 time.end=20 output.vtu=false output.directory=build/ens0\ninputs/bimaterial_strip.ini mesh.nx=10 mesh.nz_total=6 time.end=20 output.vtu=false output.directory=build/ens1\n" > build/cases.txt
          mpirun --oversubscribe -n 2 build/stripcz --ensemble build/cases.txt --threads 1
          grep -q '"complete": true' build/ens0/summary.json && grep -q '"complete": true' build/ens1/summary.json
